<!DOCTYPE html><html lang="en"><head>
        <meta charset="UTF-8">
        <title>
            QC Onboarding Task
        </title>
        <link rel="stylesheet" href="/qc-onboarding-task.2cdaf7bc.css">
    </head>
    <body>
    <div class="card">
      <h1>
        Application
      </h1>
    <!---application FORM---> 
      <div id="panel-application" class="form-panel">

        <form action="" id="applicationForm" autocomplete="on">
            <!---Institution -->
            <div class="input-group">
                <label for="applicationInstitution">
                 Institution
                </label>
                <div class="input-wrap">
                    <select id="applicationInstitution">
                        <option value=""> Select an institution </option>
                    </select>

                </div>
            </div>
            <!---course-->

            <div class="input-group">
                <label for="applicationCourse">
                Course
                </label>
                <div class="input-wrap">
                    <input type="text" id="applicationCourse" placeholder="multimedia computing" required="">
                </div>
            </div>
            <!---year-->

            <div class="input-group">
                <label for="applicationYear">
                Academic year
                </label>
                <div class="input-wrap">
                    <select id="applicationYear">
                        <option value="2026"> 2026 </option>
                        <option value="2027"> 2027 </option>
                        <option value="2028"> 2028 </option>

                    </select>
                </div>
            </div>

            <!---status-->

            <div class="input-group">
                <label for="applicationStatus">
                Status
                </label>
                <div class="input-wrap">
                    <label>
                    <input type="radio" id="applicationStatus" name="Status value=" draft"="" required=""> draft
                    </label>
                    <label>
                    <input type="radio" id="applicationStatus" name="Status" value="submit" required="">submit
                    </label>
                </div>
            </div>

            <!---notes-->

            <div class="input-group">
                <label for="applicationNotes">
                Notes
                </label>
                <div class="input-wrap">
                    <textarea id="applicationNotes" rows="5" cols="40" placeholder="write your notes here...."></textarea>
                </div>
            </div>



            <!---submit-->
            <button type="submit" class="btn-primary">
                Add
            </button>

            <div class="separator">applications</div>

            

        </form>
      </div>

     <div id="applications">
        
     </div>
 

    </div>
    
        
    <script type="module" src="/dashboard.3221258f.js"></script>







</body></html>
