<!DOCTYPE html>
<html lang="en">
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            QC Onboarding Task
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <div class="card">
      <h1>
        Application
      </h1>
    <!---application FORM---> 
      <div id="panel-application" class="form-panel" >

        <form action="" id="applicationForm" autocomplete="on">
            <!---Institution -->
            <div class="input-group">
                <label for="applicationInstitution">
                 Institution
                </label>
                <div class="input-wrap">
                    <select id = "applicationInstitution">
                        <option value=""> Select an institution </option>
                    </select>

                </div>
            </div>
            <!---course-->

            <div class="input-group">
                <label for="applicationCourse">
                Course
                </label>
                <div class="input-wrap">
                    <input type="text" id="applicationCourse" placeholder="multimedia computing" required>
                </div>
            </div>
            <!---year-->

            <div class="input-group">
                <label for="applicationYear">
                Academic year
                </label>
                <div class="input-wrap">
                    <select id = "applicationYear">
                        <option value="2026" selected> 2026 </option>
                        <option value="2027"> 2027 </option>
                        <option value="2028"> 2028 </option>

                    </select>
                </div>
            </div>

            <!---status-->

            <div class="input-group">
                <label for="applicationStatus">
                Status
                </label>
                <div class="input-wrap">
                    <div class="radio-group">


                    <label>
                    <input type="radio"  name="Status" value="draft"  required>Draft
                    </label>
                    <label>
                    <input type="radio"  name="Status" value="submitted" required>Submitted
                    </label>
                    </div>
                </div>
            </div>

            <!---notes-->

            <div class="input-group">
                <label for="applicationNotes">
                Notes
                </label>
                <div class="input-wrap">
                    <textarea  id="applicationNotes" rows="5" cols="40" placeholder="write your notes here...." ></textarea>
                </div>
            </div>



            <!---submit-->
            <button type="submit" class="btn-primary">
                Add
            </button>

            <div class="separator">applications</div>

            

        </form>
      </div>

     <div id="applications">
    <table class="application-table" id="applicationTable">
        <head>
            <tr>
                <th>
                    Institution
                </th>
                <th>
                    Course
                </th>
                <th>
                    Academic year
                </th>
                <th>
                    Status
                </th>
                <th>
                    Notes
                </th>


            </tr>
        </head>
        <tbody id="applicationsBody">

        </tbody>
    </table>
    </div>
 

    </div>
    
        
    <script type="module" src="dashboard.js"></script>

</body>
</html>
